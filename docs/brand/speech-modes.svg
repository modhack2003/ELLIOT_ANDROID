<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="374" viewBox="0 0 1280 374" role="img" aria-labelledby="title desc">
  <title id="title">Three optional Whisper language modes</title>
  <desc id="desc">Indian English, Hindi-English and Bengali-English are selectable for short live requests with optional Whisper packs. Auto is also available. Real-speech accuracy remains under evaluation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#06121E"/>
      <stop offset="1" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="edge">
      <stop stop-color="#36DCE3"/>
      <stop offset="1" stop-color="#B4A1FF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#116479" stop-opacity=".24"/>
      <stop offset="1" stop-color="#116479" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#4DDCE3" stroke-width="1.5"/>
    </marker>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#B4A1FF" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="374" rx="26" fill="url(#bg)"/>
  <ellipse cx="934.4" cy="150" rx="420" ry="220" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="1279" height="373" rx="26" fill="none" stroke="#223446"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="43" font-size="28" fill="#E8F5FB" font-weight="600">Multilingual request settings</text>
    <rect x="32" y="78" width="392" height="230" rx="22" fill="#0C1B2A" stroke="#254455"/>
    <path d="M54 79 H402" stroke="#4DDCE3" stroke-width="2"/>
    <circle cx="364" cy="165" r="56" fill="none" stroke="#4DDCE3" stroke-opacity=".12"/>
    <circle cx="364" cy="165" r="42" fill="none" stroke="#4DDCE3" stroke-opacity=".12"/>
    <text x="58" y="119" font-size="11" fill="#4DDCE3" font-weight="600" letter-spacing="1.5">WHISPER LANGUAGE MODE</text>
    <text x="58" y="186" font-size="42" fill="#4DDCE3" font-weight="600">EN</text>
    <text x="58" y="242" font-size="27" fill="#E8F5FB" font-weight="600">Indian English</text>
    <text x="58" y="277" font-size="17" fill="#A5BBCB" font-weight="400">English with regional accents</text>
    <rect x="444" y="78" width="392" height="230" rx="22" fill="#0C1B2A" stroke="#254455"/>
    <path d="M466 79 H814" stroke="#B4A1FF" stroke-width="2"/>
    <circle cx="776" cy="165" r="56" fill="none" stroke="#B4A1FF" stroke-opacity=".12"/>
    <circle cx="776" cy="165" r="42" fill="none" stroke="#B4A1FF" stroke-opacity=".12"/>
    <text x="470" y="119" font-size="11" fill="#B4A1FF" font-weight="600" letter-spacing="1.5">WHISPER LANGUAGE MODE</text>
    <text x="470" y="186" font-size="42" fill="#B4A1FF" font-weight="600">HI + EN</text>
    <text x="470" y="242" font-size="27" fill="#E8F5FB" font-weight="600">Hindi-English</text>
    <text x="470" y="277" font-size="17" fill="#A5BBCB" font-weight="400">Mixed-language requests</text>
    <rect x="856" y="78" width="392" height="230" rx="22" fill="#0C1B2A" stroke="#254455"/>
    <path d="M878 79 H1226" stroke="#6DD5B3" stroke-width="2"/>
    <circle cx="1188" cy="165" r="56" fill="none" stroke="#6DD5B3" stroke-opacity=".12"/>
    <circle cx="1188" cy="165" r="42" fill="none" stroke="#6DD5B3" stroke-opacity=".12"/>
    <text x="882" y="119" font-size="11" fill="#6DD5B3" font-weight="600" letter-spacing="1.5">WHISPER LANGUAGE MODE</text>
    <text x="882" y="186" font-size="42" fill="#6DD5B3" font-weight="600">BN + EN</text>
    <text x="882" y="242" font-size="27" fill="#E8F5FB" font-weight="600">Bengali-English</text>
    <text x="882" y="277" font-size="17" fill="#A5BBCB" font-weight="400">Mixed-language requests</text>
    <text x="32" y="346" font-size="17" fill="#A5BBCB" font-weight="400">Optional Small / Turbo packs · Auto also available · Live accuracy remains under evaluation</text>
  </g>
</svg>
